image: docker:19.03.12

variables:
  # When using dind service, we need to instruct docker to talk with
  # the daemon started inside of the service. The daemon is available
  # with a network connection instead of the default
  # /var/run/docker.sock socket. Docker 19.03 does this automatically
  # by setting the DOCKER_HOST in
  # https://github.com/docker-library/docker/blob/d45051476babc297257df490d22cbd806f1b11e4/19.03/docker-entrypoint.sh#L23-L29
  #
  # The 'docker' hostname is the alias of the service container as described at
  # https://docs.gitlab.com/ee/ci/docker/using_docker_images.html#accessing-the-services.
  #
  # Specify to Docker where to create the certificates, Docker will
  # create them automatically on boot, and will create
  # `/certs/client` that will be shared between the service and job
  # container, thanks to volume mount from config.toml.
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - docker:19.03.12-dind

before_script:
  - docker info
  - export STITCH_CONNECT_APP_HOST="$STITCH_CONNECT_APP_HOST"
  - export STITCH_CONNECT_APP_PORT="$STITCH_CONNECT_APP_PORT"
  - export STITCH_CONNECT_SSL_KEY_PATH="$STITCH_CONNECT_SSL_KEY_PATH"
  - export STITCH_CONNECT_SSL_CERT_PATH="$STITCH_CONNECT_SSL_CERT_PATH"
  - export SECRET_KEY_BASE="$SECRET_KEY_BASE"
  - export STITCH_CONNECT_POSTGRES_PORT="$STITCH_CONNECT_POSTGRES_PORT"
  - export STITCH_CONNECT_POSTGRES_HOSTNAME="$STITCH_CONNECT_POSTGRES_HOSTNAME"
  - export STITCH_CONNECT_POSTGRES_USERNAME="STITCH_CONNECT_POSTGRES_USERNAME"
  - export STITCH_CONNECT_POSTGRES_PASSWORD="$STITCH_CONNECT_POSTGRES_PASSWORD"
  - export STITCH_CONNECT_POSTGRES_DATABASE="$STITCH_CONNECT_POSTGRES_DATABASE"
  - export MAILGUN_KEY="$MAILGUN_KEY"
  - export MAILGUN_SECRET="$MAILGUN_SECRET"
  - export MAILGUN_DOMAIN="$MAILGUN_DOMAIN"
  - export DISABLE_BACKGROUND_WORKERS="$DISABLE_BACKGROUND_WORKERS"
  - export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
  - export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
  - export S3_REGION=$S3_REGION
  - export S3_AVATAR_BUCKET_NAME="$S3_AVATAR_BUCKET_NAME"
  - export S3_CONTENT_BUCKET_NAME="$S3_CONTENT_BUCKET_NAME"
  - export S3_PUBLIC_BUCKET_NAME="$S3_PUBLIC_BUCKET_NAME"
  - export AVATAR_CDN_ORIGIN="$AVATAR_CDN_ORIGIN"
  - export PUBLIC_CDN_ORIGIN="$PUBLIC_CDN_ORIGIN"
  - export APNS_MODE="$APNS_MODE"
  - export APNS_TOPIC="$APNS_TOPIC"
  - export APNS_CERT_B64="$APNS_CERT_B64"
  - export APNS_KEY_B64="$APNS_KEY_B64"
  - export FCM_KEY="$FCM_KEY"
  - export STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
  - export STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY"
  - export SEGMENT_WRITE_KEY="$SEGMENT_WRITE_KEY"
  - export SEGMENT_JAVASCRIPT_WRITE_KEY="$SEGMENT_JAVASCRIPT_WRITE_KEY"
  - export TWILIO_ACCOUNT_SID="$TWILIO_ACCOUNT_SID"
  - export TWILIO_AUTH_TOKEN="$TWILIO_AUTH_TOKEN"
  - export INTERCOM_APP_ID="$INTERCOM_APP_ID"
  - export INTERCOM_IDENTITY_VERIFICATION_SECRET="$INTERCOM_IDENTITY_VERIFICATION_SECRET"
  - export TOKBOX_API_KEY="$TOKBOX_API_KEY"
  - export TOKBOX_SECRET="$TOKBOX_SECRET"

build:
  stage: build
  script:
    - echo "We are using AWS Region $S3_REGION"


